[package]
name = "sentry-drive"
version = "2.0.1"
description = "Sentry Drive (Tauri preview)"
authors = ["Sentry-Six"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "sentry_drive_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = "0.4"
base64 = "0.22"
bincode = "1.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
regex = "1"
ureq = { version = "3", features = ["json"] }
semver = "1"
tokio = { version = "1", features = ["sync"] }
sys-locale = "0.3.2"
mimalloc = "0.1.52"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = "0.13"
sha1 = "0.11"
libm = "0.2"
rusty-leveldb = "4"

[target.'cfg(windows)'.dependencies]
aes-gcm = "0.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

# The Windows token migration's AES-GCM step is also tested on macOS and Linux.
[dev-dependencies]
aes-gcm = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Proc-macros and build scripts must keep their metadata: stripping them
# breaks `--target` builds ("can't find crate for `tauri_macros`").
[profile.release.build-override]
strip = false
