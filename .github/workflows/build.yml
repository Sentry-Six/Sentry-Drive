name: Build and Release

# Builds the Tauri app for macOS (universal), Windows and Linux. On a
# published release it also uploads the installers, the Tauri updater
# manifest (latest.json) and electron-updater feeds (latest*.yml) that move
# existing Electron installs onto the Tauri build.
#
# Secrets (in addition to the existing macOS signing ones):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     the updater signing key from `npx tauri signer generate`
# Variables:
#   TAURI_UPDATER_PUBKEY  the matching public key (not secret)
# Without them the build still runs, but produces no updater artifacts.
#
# Windows code signing (Microsoft Artifact Signing, no stored secret): the
# Windows job logs in to Azure with GitHub's OIDC token, which Azure trusts only
# for jobs in the `windows-signing` environment of this repository. That
# environment requires an approver before the job starts. Variables:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE
# Without them the Windows build runs unsigned.

on:
  workflow_dispatch:
  release:
    # published fires for both direct publishes and draft-then-publish;
    # created never fires when a saved draft is later published.
    types: [published]

permissions:
  contents: write

jobs:
  # Rust tests run in test.yml on every push to main and every PR, so the
  # release builds go straight to building.

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            environment: windows-signing
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    # Only the Windows leg signs; an empty name means no environment.
    environment: ${{ matrix.environment }}
    permissions:
      contents: write
      id-token: write
    env:
      HAS_MAC_SIGNING: ${{ secrets.MAC_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
      HAS_WIN_SIGNING: ${{ matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Sync package.json to tag (runner only)
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json to $VERSION on the runner (not committed)."
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: JS tests
        run: npm test

      - name: Azure login (Windows signing)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Artifact Signing module
        if: env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        run: Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser

      # The updater key turns on updater artifacts (.sig files); the public
      # key is built into the app so it can verify downloads.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          [ "$HAS_UPDATER_KEY" = true ] || echo "::warning::Updater key not set; this build can't update itself."
          [ "$RUNNER_OS" != Windows ] || [ "$HAS_WIN_SIGNING" = true ] || echo "::warning::Azure signing not configured; the Windows build is unsigned."
          # Tauri runs signCommand for the app, the uninstaller and the installer,
          # before it computes the updater signatures.
          overlay=$(node -e '
            const o = {}
            if (process.env.HAS_UPDATER_KEY === "true") {
              o.bundle = { createUpdaterArtifacts: true }
              o.plugins = { updater: { pubkey: process.env.TAURI_UPDATER_PUBKEY } }
            }
            if (process.env.HAS_WIN_SIGNING === "true") {
              const script = require("path").win32.join(process.env.GITHUB_WORKSPACE, "scripts", "sign-windows.ps1")
              o.bundle = { ...o.bundle, windows: { signCommand: { cmd: "pwsh", args: ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", script, "%1"] } } }
            }
            console.log(JSON.stringify(o))')
          npx tauri build --bundles ${{ matrix.bundles }} --config "$overlay"

      # The installer, the app inside it and its uninstaller must all carry a
      # valid signature from the expected publisher before anything is kept.
      - name: Verify Windows signatures
        if: env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          & $setup.FullName /S | Out-Null
          $dir = Join-Path $env:LOCALAPPDATA 'Sentry Drive'
          $files = @($setup.FullName, (Join-Path $dir 'Sentry Drive.exe'), (Join-Path $dir 'uninstall.exe'))
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            Write-Host "$(Split-Path -Leaf $f): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'CN=Scott Vandereems') { throw "$f is not signed by Scott Vandereems" }
            if (-not $s.TimeStamperCertificate) { throw "$f has no timestamp" }
          }

      - name: Collect artifacts
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          mkdir -p release
          if [ "$RUNNER_OS" = Windows ]; then
            B=src-tauri/target/release/bundle/nsis
            exe=$(ls "$B"/*-setup.exe | head -1)
            cp "$exe" "release/Sentry-Drive-Setup-$VERSION.exe"
            [ -f "$exe.sig" ] && cp "$exe.sig" "release/Sentry-Drive-Setup-$VERSION.exe.sig"
          else
            B=src-tauri/target/release/bundle
            img=$(ls "$B"/appimage/*.AppImage | head -1)
            deb=$(ls "$B"/deb/*.deb | head -1)
            cp "$img" "release/Sentry-Drive-$VERSION.AppImage"
            [ -f "$img.sig" ] && cp "$img.sig" "release/Sentry-Drive-$VERSION.AppImage.sig"
            cp "$deb" "release/sentry-drive_${VERSION}_amd64.deb"
            [ -f "$deb.sig" ] && cp "$deb.sig" "release/sentry-drive_${VERSION}_amd64.deb.sig"
            dpkg-deb -f "$deb" Package Version
          fi
          ls -la release

      - name: Retain release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          retention-days: 30
          if-no-files-found: error
          path: release/*

  # The two halves of the universal Mac app compile at the same time on two
  # runners; mac-universal joins them with lipo, then signs, notarizes and
  # bundles. The updater public key is compiled in, so both halves get it.
  mac-arch:
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      HAS_MAC_SIGNING: ${{ secrets.MAC_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Sync package.json to tag (runner only)
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json to $VERSION on the runner (not committed)."
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: JS tests
        run: npm test

      - name: Compile
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          overlay='{}'
          if [ "$HAS_UPDATER_KEY" = true ]; then
            overlay=$(node -e 'console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.TAURI_UPDATER_PUBKEY}}}))')
          else
            echo "::warning::Updater key not set; this build can't update itself."
          fi
          npx tauri build --target ${{ matrix.target }} --no-bundle --config "$overlay"
          ls -la src-tauri/target/${{ matrix.target }}/release/

      - name: Keep the binary
        uses: actions/upload-artifact@v7
        with:
          name: mac-bin-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error
          # mainBinaryName renames the binary; keep the Cargo name as a
          # fallback in case the CLI leaves it alone with --no-bundle.
          path: |
            src-tauri/target/${{ matrix.target }}/release/Sentry Drive
            src-tauri/target/${{ matrix.target }}/release/sentry-drive

  mac-universal:
    needs: mac-arch
    runs-on: macos-latest
    env:
      HAS_MAC_SIGNING: ${{ secrets.MAC_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync package.json to tag (runner only)
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json to $VERSION on the runner (not committed)."
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Download both halves
        uses: actions/download-artifact@v7
        with:
          pattern: mac-bin-*
          path: mac-bin

      - name: Join them into one universal binary
        shell: bash
        run: |
          node scripts/tauri/prepare-frontend.mjs
          out=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$out"
          half() { for n in "Sentry Drive" sentry-drive; do
            [ -f "mac-bin/mac-bin-$1/$n" ] && { echo "mac-bin/mac-bin-$1/$n"; return; }; done
            echo "::error::no binary for $1" >&2; exit 1; }
          arm=$(half aarch64-apple-darwin); x86=$(half x86_64-apple-darwin)
          lipo -create -output "$out/Sentry Drive" "$arm" "$x86"
          cp "$out/Sentry Drive" "$out/sentry-drive"
          chmod +x "$out/Sentry Drive" "$out/sentry-drive"
          test "$(lipo -archs "$out/Sentry Drive")" = "x86_64 arm64"

      - name: Set up macOS signing and notarization
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          # Tauri signs with APPLE_SIGNING_IDENTITY and notarizes with the
          # App Store Connect API key (APPLE_API_KEY + _ISSUER + _KEY_PATH).
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Scott Vandereems (6733Y82885)" >> "$GITHUB_ENV"
          echo "MAC_SIGNING=1" >> "$GITHUB_ENV"

      - name: Bundle, sign and notarize
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          overlay='{}'
          if [ "$HAS_UPDATER_KEY" = true ]; then
            overlay=$(node -e 'console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.TAURI_UPDATER_PUBKEY}}}))')
          else
            echo "::warning::Updater key not set; this build can't update itself."
          fi
          if [ "${MAC_SIGNING:-}" != 1 ]; then
            echo "::warning::macOS signing secrets are not set; building an ad-hoc signed app."
            unset APPLE_API_KEY APPLE_API_ISSUER
          fi
          npx tauri bundle --target universal-apple-darwin --bundles app,dmg --config "$overlay"

      - name: Collect artifacts
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          mkdir -p release
          B=src-tauri/target/universal-apple-darwin/release/bundle
          app="$B/macos/Sentry Drive.app"
          # electron-updater (Squirrel.Mac) installs from a zip of the app.
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/Sentry-Drive-$VERSION-universal.zip"
          cp "$B"/dmg/*.dmg "release/Sentry-Drive-$VERSION-universal.dmg"
          if [ -f "$B/macos/Sentry Drive.app.tar.gz" ]; then
            cp "$B/macos/Sentry Drive.app.tar.gz" "release/Sentry-Drive-$VERSION-universal.app.tar.gz"
            cp "$B/macos/Sentry Drive.app.tar.gz.sig" "release/Sentry-Drive-$VERSION-universal.app.tar.gz.sig"
          fi
          ls -la release

      # One universal app serves Intel and Apple silicon Macs, and the
      # updaters on both move existing installs to it, so every Mach-O file
      # in it must carry both architectures.
      - name: Verify universal macOS app
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Sentry Drive.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.jefffromtheirs.sentry-drive
          status=0
          while IFS= read -r -d '' file; do
            archs=$(lipo -archs "$file" 2>/dev/null) || continue
            if [ "$archs" != "x86_64 arm64" ]; then
              echo "::error::${file#$app/} has architectures: $archs"
              status=1
            fi
          done < <(find "$app" -type f -print0)
          exit $status

      - name: Verify macOS signature and notarization
        if: env.MAC_SIGNING == '1'
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Sentry Drive.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -F 'TeamIdentifier=6733Y82885'
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"

      - name: Retain release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-macOS
          retention-days: 30
          if-no-files-found: error
          path: release/*

  publish:
    needs: [build, mac-universal]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Write update feeds
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/tauri/release-feeds.mjs release "$VERSION" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat release/latest-mac.yml
          grep -E '^  - url: Sentry-Drive-.*-universal\.zip$' release/latest-mac.yml

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          # Installers first, feeds last: a feed must never point at a file
          # that isn't uploaded yet.
          bash scripts/upload-release-assets.sh "$GITHUB_REF_NAME" \
            release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb \
            release/*.tar.gz release/*.sig
          bash scripts/upload-release-assets.sh "$GITHUB_REF_NAME" \
            release/latest.json release/latest*.yml
