name: Build and Release

on:
  workflow_dispatch:
  release:
    # published fires for both direct publishes and draft-then-publish;
    # created never fires when a saved draft is later published.
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Sync package.json to tag (runner only)
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json to $VERSION on the runner (not committed)."
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run drive-calc lock tests
        run: npm test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Retain release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

      - name: Upload assets (Windows)
        if: github.event_name == 'release' && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.exe dist/latest.yml --clobber

      - name: Upload assets (macOS)
        if: github.event_name == 'release' && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg dist/latest-mac.yml --clobber

      - name: Upload assets (Linux)
        if: github.event_name == 'release' && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage dist/*.deb dist/latest-linux.yml --clobber
